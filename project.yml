# Generate the Xcode project with `xcodegen generate` (brew install xcodegen).
name: Attention

options:
  bundleIdPrefix: dk.dammark
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Your Apple Developer Team ID (Xcode > Settings > Accounts). A free
    # Personal Team works. Widgets won't load without a signed build.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_ID: $(DEVELOPMENT_TEAM).dk.dammark.attention
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Attention:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: hooks/attention-hook.sh
        buildPhase: resources
    dependencies:
      - target: AttentionWidget
    info:
      path: Support/Attention-Info.plist
      properties:
        CFBundleDisplayName: Attention
        LSApplicationCategoryType: public.app-category.developer-tools
        # Menu bar only: no Dock icon.
        LSUIElement: true
        AttentionAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Support/Attention.entitlements
      properties:
        # Not sandboxed: the app has to read ~/.claude and edit ~/.claude/settings.json.
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.dammark.attention

  AttentionWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    info:
      path: Support/AttentionWidget-Info.plist
      properties:
        CFBundleDisplayName: Attention
        AttentionAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/AttentionWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.dammark.attention.widget
